name: Deploy Enfoco to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'enfoco-github/package-lock.json'

      - name: Install Dependencies
        working-directory: enfoco-github
        run: npm ci || npm install

      - name: Build Application
        working-directory: enfoco-github
        run: npm run build
        env:
          CI: false

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'enfoco-github/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
